<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><h1>Our Pricing Plans</h1>
<p class="intro">Choose the plan that suits you.</p>

<div class="container">

    <div class="card">
        <h2>Basic</h2>
        <h3>₦5,000/month</h3>

        <ul>
            <li>1 Project</li>
            <li>Basic Support</li>
            <li>Basic Features</li>
        </ul>

        <input type="radio" name="plan" id="basic">
        <label for="basic">Choose Plan</label>
    </div>

    <div class="card popular">
        <p class="badge">Most Popular</p>

        <h2>Standard</h2>
        <h3>₦10,000/month</h3>

        <ul>
            <li>5 Projects</li>
            <li>Priority Support</li>
            <li>More Features</li>
        </ul>

        <input type="radio" name="plan" id="standard" checked>
        <label for="standard">Choose Plan</label>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h3>₦20,000/month</h3>

        <ul>
            <li>Unlimited Projects</li>
            <li>Full Support</li>
            <li>All Features</li>
        </ul>

        <input type="radio" name="plan" id="premium">
        <label for="premium">Choose Plan</label>
    </div>

</div>

</body>
</html>
